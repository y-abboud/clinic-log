<script>
/* ---------- Configuration: paste the Azure "Application (client) ID" here to switch from demo to OneDrive ---------- */
const CONFIG = { clientId: '', folder: 'מעקב מרפאה' };

const LIBS = {
  msal: 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js',
  excel: 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  h2c: 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
  pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
};
const ALLOCATION_THRESHOLD = 5000;
const DEMO = !CONFIG.clientId;
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

/* ---------- Pure helpers ---------- */
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '₪' + Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => isoDate(new Date());
const fmtDate = s => s ? s.split('-').reverse().join('/') : '';
/* Dates are shown and typed as dd/mm/yyyy; state keeps ISO so they sort and compare correctly. */
function parseDate(s) {
  const m = String(s).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
  return d.getMonth() === Number(m[2]) - 1 && d.getDate() === Number(m[1]) ? isoDate(d) : null;
}
/* Adds the slashes while typing, so digits alone are enough on a phone keypad. */
function formatDateTyping(raw) {
  const parts = raw.replace(/[^\d\/.\-]/g, '').split(/[\/.\-]/);
  for (const i of [0, 1]) {
    if (parts[i] && parts[i].length > 2) { parts[i + 1] = parts[i].slice(2) + (parts[i + 1] || ''); parts[i] = parts[i].slice(0, 2); }
  }
  if (parts[2]) parts[2] = parts[2].slice(0, 4);
  return parts.slice(0, 3).join('/');
}
const quarterOf = s => { const [y, m] = s.split('-').map(Number); return y + 'Q' + Math.ceil(m / 3); };
const fmtPeriod = p => { if (!p) return ''; const [y, m] = p.split('-').map(Number); return MONTHS[m - 1] + ' ' + y; };
function fmtPeriodRange(from, to) {
  if (!to || to === from) return fmtPeriod(from);
  const [fy, fm] = from.split('-').map(Number), [ty] = to.split('-').map(Number);
  return (fy === ty ? MONTHS[fm - 1] : fmtPeriod(from)) + ' עד ' + fmtPeriod(to);
}
const typeName = t => t === 'new' ? 'ראשון' : 'חוזר';

function defaults() {
  return {
    v: 1,
    rates: { genNew: 119.88, genRet: 0, point: 23.9, iud: 305.93, hrNew: 180, hrRet: 100, vat: 18 },
    treatments: [{ id: 'us-gyn', name: 'US Gynecology', points: 1.2 }],
    visits: [], payments: [], invoices: [],
    issuer: { name: '', address: '', phone: '', osek: '300969664' },
    customer: { name: 'מכבי שירותי בריאות', address: 'המרד 27, תל אביב', taxId: '', supplierNo: '' },
    docTitle: 'חשבונית מס',
    service: 'שירותי רפואה: רופא נשים ורופא הריון בסיכון גבוה',
    nextInvoiceNo: 1
  };
}
function normalize(raw) {
  const d = defaults();
  if (!raw) return d;
  return { ...d, ...raw, rates: { ...d.rates, ...raw.rates }, issuer: { ...d.issuer, ...raw.issuer }, customer: { ...d.customer, ...raw.customer } };
}

/* The money for a visit is fixed when it is saved, so a later rate change does not rewrite past reports. */
function visitPay(v, r) {
  if (v.role === 'hr') return { visit: v.type === 'new' ? r.hrNew : r.hrRet, points: 0, iud: 0 };
  return { visit: v.type === 'new' ? r.genNew : r.genRet, points: round2((v.points || 0) * r.point), iud: v.iud ? r.iud : 0 };
}
const visitTotal = v => round2(v.pay.visit + v.pay.points + v.pay.iud);

function summarize(visits, from, to, vatPct) {
  const inRange = visits.filter(v => v.date >= from && v.date <= to);
  const s = { gen: { newN: 0, retN: 0, points: 0, iudN: 0, newM: 0, retM: 0, pointsM: 0, iudM: 0, total: 0 }, hr: { newN: 0, retN: 0, newM: 0, retM: 0, total: 0 }, rows: inRange };
  for (const v of inRange) {
    const t = s[v.role];
    if (v.type === 'new') { t.newN++; t.newM += v.pay.visit; } else { t.retN++; t.retM += v.pay.visit; }
    if (v.role === 'gen') { t.points += v.points || 0; t.pointsM += v.pay.points; if (v.iud) { t.iudN++; t.iudM += v.pay.iud; } }
  }
  for (const k of ['newM', 'retM', 'pointsM', 'iudM', 'points']) s.gen[k] = round2(s.gen[k]);
  s.hr.newM = round2(s.hr.newM); s.hr.retM = round2(s.hr.retM);
  s.gen.total = round2(s.gen.newM + s.gen.retM + s.gen.pointsM + s.gen.iudM);
  s.hr.total = round2(s.hr.newM + s.hr.retM);
  s.subtotal = round2(s.gen.total + s.hr.total);
  s.vat = round2(s.subtotal * vatPct / 100);
  s.grand = round2(s.subtotal + s.vat);
  return s;
}

/* Finds the amount and VAT by arithmetic (amount × rate = VAT, amount + VAT = total) rather than by label,
   because Hebrew text extracted from PDFs often comes back out of order. */
function detectAmounts(text, vatPct) {
  const clean = text.replace(/\b\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}\b/g, ' ');
  const found = clean.match(/\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?|\d+\.\d{1,2}|\d{3,}/g) || [];
  const nums = [...new Set(found.map(x => Number(x.replace(/,/g, ''))))].filter(n => n >= 1).sort((a, b) => b - a);
  const near = (a, b, tol) => Math.abs(a - b) <= tol;
  for (const rate of [vatPct / 100, 0.17]) {
    let pair = null;
    for (const a of nums) {
      const v = nums.find(x => near(x, a * rate, 0.05));
      if (v == null) continue;
      if (nums.some(t => near(t, a + v, 0.05))) return { amount: a, vat: v, certain: true };
      pair = pair || { amount: a, vat: v, certain: false };
    }
    if (pair) return pair;
  }
  return null;
}
function detectPeriod(text) {
  const m = text.match(/(?<![\d\/.\-])(0?[1-9]|1[0-2])[\/.\-](20\d{2})(?![\d\/.\-])/);
  if (m) return m[2] + '-' + pad(Number(m[1]));
  for (let i = 0; i < 12; i++) {
    const h = text.match(new RegExp(MONTHS[i] + '\\s*(20\\d{2})'));
    if (h) return h[1] + '-' + pad(i + 1);
  }
  return null;
}
function previousMonth(dateStr) {
  const [y, m] = dateStr.split('-').map(Number);
  return m === 1 ? (y - 1) + '-12' : y + '-' + pad(m - 1);
}

/* ---------- Storage backends: both expose load, save, putFile, getFile, deleteFile ---------- */
function conflictError() { const e = new Error('conflict'); e.conflict = true; return e; }

function GraphBackend(getToken, fetchFn, folder) {
  const base = 'https://graph.microsoft.com/v1.0/me/drive/root:/';
  const itemUrl = path => base + [folder, ...path.split('/')].map(encodeURIComponent).join('/');
  const call = async (url, opts = {}) => {
    const headers = { Authorization: 'Bearer ' + await getToken(), ...(opts.headers || {}) };
    return fetchFn(url, { ...opts, headers });
  };
  const fail = async (r, what) => { throw new Error(what + ' נכשל (' + r.status + ')'); };
  /* Graph's /content redirect is not CORS-safe in browsers; the pre-authenticated download URL is. */
  const meta = async path => {
    const r = await call(itemUrl(path) + ':?$select=id,eTag,@microsoft.graph.downloadUrl');
    if (r.status === 404) return null;
    if (!r.ok) await fail(r, 'קריאה מ-OneDrive');
    return r.json();
  };
  const putSmall = (path, body, type, extra = {}) => call(itemUrl(path) + ':/content', { method: 'PUT', body, headers: { 'Content-Type': type, ...extra } });
  return {
    async load() {
      const m = await meta('data.json');
      if (!m) return { data: null, etag: null };
      const r = await fetchFn(m['@microsoft.graph.downloadUrl']);
      if (!r.ok) await fail(r, 'קריאת הנתונים');
      return { data: await r.json(), etag: m.eTag };
    },
    async save(data, etag) {
      const r = await putSmall('data.json', JSON.stringify(data), 'application/json', etag ? { 'If-Match': etag } : { 'If-None-Match': '*' });
      if (r.status === 412 || r.status === 409) throw conflictError();
      if (!r.ok) await fail(r, 'שמירה ל-OneDrive');
      return (await r.json()).eTag;
    },
    async putFile(path, blob) {
      const type = blob.type || 'application/pdf';
      if (blob.size <= 4 * 1024 * 1024) {
        const r = await putSmall(path, blob, type);
        if (!r.ok) await fail(r, 'העלאת קובץ');
        return;
      }
      const s = await call(itemUrl(path) + ':/createUploadSession', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: { '@microsoft.graph.conflictBehavior': 'replace' } }) });
      if (!s.ok) await fail(s, 'העלאת קובץ');
      const { uploadUrl } = await s.json();
      const chunk = 320 * 1024 * 10;
      for (let i = 0; i < blob.size; i += chunk) {
        const end = Math.min(i + chunk, blob.size);
        const r = await fetchFn(uploadUrl, { method: 'PUT', body: blob.slice(i, end), headers: { 'Content-Range': 'bytes ' + i + '-' + (end - 1) + '/' + blob.size } });
        if (!r.ok) await fail(r, 'העלאת קובץ');
      }
    },
    async getFile(path) {
      const m = await meta(path);
      if (!m) throw new Error('הקובץ לא נמצא ב-OneDrive');
      const r = await fetchFn(m['@microsoft.graph.downloadUrl']);
      if (!r.ok) await fail(r, 'הורדת הקובץ');
      return r.blob();
    },
    async deleteFile(path) {
      const r = await call(itemUrl(path), { method: 'DELETE' });
      if (!r.ok && r.status !== 404) await fail(r, 'מחיקת קובץ');
    }
  };
}

function DemoBackend() {
  const memory = new Map();
  const dbp = new Promise(res => {
    try {
      const o = indexedDB.open('clinic-demo', 1);
      o.onupgradeneeded = () => o.result.createObjectStore('kv');
      o.onsuccess = () => res(o.result);
      o.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  const get = async k => {
    const db = await dbp;
    if (!db) return memory.get(k);
    return new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(memory.get(k)); });
  };
  const put = async (k, v) => {
    memory.set(k, v);
    const db = await dbp;
    if (!db) return;
    await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; });
  };
  return {
    async load() { return { data: (await get('data')) || null, etag: 'demo' }; },
    async save(data) { await put('data', JSON.parse(JSON.stringify(data))); return 'demo'; },
    async putFile(path, blob) { await put('file:' + path, blob); },
    async getFile(path) { const b = await get('file:' + path); if (!b) throw new Error('הקובץ לא נמצא'); return b; },
    async deleteFile(path) { await put('file:' + path, null); }
  };
}

/* mutate re-applies the change on the latest data after a conflict, so two devices cannot lose entries or reuse an invoice number. */
function makeStore(backend) {
  const store = {
    state: null, etag: null,
    async refresh() { const r = await backend.load(); store.state = normalize(r.data); store.etag = r.etag; store.isNew = !r.data; },
    async mutate(fn) {
      for (let i = 0; i < 5; i++) {
        const draft = JSON.parse(JSON.stringify(store.state));
        const out = fn(draft);
        try {
          store.etag = await backend.save(draft, store.etag);
          store.state = draft;
          return out;
        } catch (e) {
          if (!e.conflict) throw e;
          await store.refresh();
        }
      }
      throw new Error('השמירה נכשלה: הנתונים השתנו במכשיר אחר. נסה שוב.');
    },
    backend
  };
  return store;
}

/* ---------- Library loading and file delivery ---------- */
const scriptCache = {};
function loadScript(url) {
  return scriptCache[url] = scriptCache[url] || new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = url; s.onload = res; s.onerror = () => { delete scriptCache[url]; rej(new Error('טעינת רכיב נכשלה. בדוק את החיבור לאינטרנט.')); };
    document.head.appendChild(s);
  });
}
async function deliverFile(blob, filename) {
  if (window.claude && window.claude.use) {
    const dl = await window.claude.use('downloads');
    if (dl) {
      try { await dl.save({ filename, data: blob }); } catch (e) { if (e.code !== 'declined') throw new Error('ההורדה נכשלה'); }
      return;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function buildWorkbook(s, from, to, vatPct) {
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('סיכום', { views: [{ rightToLeft: true }] });
  ws.columns = [{ width: 34 }, { width: 12 }, { width: 16 }];
  const MONEY = '#,##0.00 "₪"';
  const thin = { style: 'thin', color: { argb: 'FFB8C2CC' } };
  const paint = (row, argb, font) => row.eachCell({ includeEmpty: true }, c => {
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb } };
    c.font = font; c.border = { top: thin, bottom: thin, left: thin, right: thin };
  });
  ws.addRow(['דו"ח ביקורים וטיפולים']).font = { bold: true, size: 15 };
  ws.addRow([fmtDate(from) + ' עד ' + fmtDate(to)]);
  ws.addRow([]);
  const table = (title, argb, rows, total) => {
    ws.addRow([title]).font = { bold: true, size: 12, color: { argb } };
    paint(ws.addRow(['פריט', 'כמות', 'סכום']), argb, { bold: true, color: { argb: 'FFFFFFFF' } });
    const first = ws.rowCount + 1;
    for (const [name, qty, sum] of rows) {
      const r = ws.addRow([name, qty, sum]);
      r.getCell(3).numFmt = MONEY;
      r.eachCell({ includeEmpty: true }, c => { c.border = { top: thin, bottom: thin, left: thin, right: thin }; });
    }
    const last = ws.rowCount;
    const r = ws.addRow([total.label, null, { formula: 'SUM(C' + first + ':C' + last + ')', result: total.value }]);
    r.getCell(3).numFmt = MONEY;
    paint(r, 'FFE6EBF0', { bold: true });
    ws.addRow([]);
    return r.number;
  };
  const a = table('מרפאת נשים כללית', 'FF1F5A8C', [
    ['ביקורים ראשונים ברבעון', s.gen.newN, s.gen.newM],
    ['ביקורים חוזרים', s.gen.retN, s.gen.retM],
    ['נקודות טיפול', s.gen.points, s.gen.pointsM],
    ['התקנים', s.gen.iudN, s.gen.iudM]
  ], { label: 'סה"כ נשים כללית', value: s.gen.total });
  const b = table('מרפאת הריון בסיכון גבוה', 'FF8A2C5C', [
    ['מטופלות חדשות', s.hr.newN, s.hr.newM],
    ['ביקורים חוזרים', s.hr.retN, s.hr.retM]
  ], { label: 'סה"כ הריון בסיכון גבוה', value: s.hr.total });
  const line = (label, formula, value, bold) => {
    const r = ws.addRow([label, null, { formula, result: value }]);
    r.getCell(3).numFmt = MONEY;
    if (bold) paint(r, 'FFE6EBF0', { bold: true, size: 12 });
    return r.number;
  };
  const sub = line('סה"כ שתי המרפאות (לפני מע"מ)', 'C' + a + '+C' + b, s.subtotal, true);
  const vat = line('מע"מ ' + vatPct + '%', 'ROUND(C' + sub + '*' + vatPct / 100 + ',2)', s.vat, false);
  line('סה"כ כולל מע"מ', 'C' + sub + '+C' + vat, s.grand, true);

  const d = wb.addWorksheet('פירוט', { views: [{ rightToLeft: true, state: 'frozen', ySplit: 1 }] });
  d.columns = [{ header: 'תאריך', width: 12 }, { header: 'מרפאה', width: 20 }, { header: 'ראשי תיבות', width: 12 }, { header: 'ת"ז', width: 12 }, { header: 'ביקור', width: 9 }, { header: 'טיפולים', width: 30 }, { header: 'נקודות', width: 9 }, { header: 'סוג התקן', width: 18 }, { header: 'סכום לפני מע"מ', width: 15 }];
  d.getRow(1).font = { bold: true };
  [...s.rows].sort((x, y) => x.date.localeCompare(y.date)).forEach(v => {
    const r = d.addRow([fmtDate(v.date), v.role === 'gen' ? 'נשים כללית' : 'הריון בסיכון גבוה', v.initials || '', v.idNo || '', typeName(v.type),
      (v.treatments || []).map(t => t.name + (t.count > 1 ? ' ×' + t.count : '')).join(', '), v.role === 'gen' ? (v.points || 0) : '', v.iud ? (v.iudType || 'התקן') : '', visitTotal(v)]);
    r.getCell(9).numFmt = MONEY;
  });
  return wb;
}

      const d = new Date(), y = d.getFullYear(), m = d.getMonth();
      if (b.dataset.r === 'this') R = { from: isoDate(new Date(y, m, 1)), to: isoDate(d) };
      else R = { from: isoDate(new Date(y, m - 1, 1)), to: isoDate(new Date(y, m, 0)) };
      render(); break;
    }
    case 'excel':
      await safely(async () => {
        b.disabled = true;
        await loadScript(LIBS.excel);
        const s = st(), sum = summarize(s.visits, R.from, R.to, s.rates.vat);
        const buf = await buildWorkbook(sum, R.from, R.to, s.rates.vat).xlsx.writeBuffer();
        await deliverFile(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), 'דוח_' + R.from + '_' + R.to + '.xlsx');
      });
      b.disabled = false; break;
    case 'cancelPay': P = null; render(); break;
    case 'savePay': {
      const amount = round2(P.amount), vat = round2(P.vat);
      if (!P.date || !(amount > 0) || !(vat >= 0)) { P.error = 'הזן תאריך, סכום ומע"מ.'; render(); break; }
      b.disabled = true;
      await safely(async () => {
        const pid = uid(), file = 'תשלומים/' + P.date + '_' + pid + '.pdf';

        P = null; toast('התשלום נשמר'); render();
      });
      b.disabled = false; break;

    case 'openPdf':
      await safely(async () => { const p = st().payments.find(x => x.id === id); await deliverFile(await store.backend.getFile(p.file), 'פירוט_' + p.date + '.pdf'); });
      break;
    case 'delPay':
      if (armed !== id) { arm(id); break; }

      await safely(async () => {

        if (p.file) await store.backend.deleteFile(p.file);

      });

    case 'invNew': {

    case 'issue': await issueInvoice(); break;
    case 'saveSetup': {
      const n = o => { const r = {}; for (const k in o) r[k] = Number(o[k]) || 0; return r; };
      const next = Math.floor(Number(S.nextInvoiceNo));

        S = null; toast('ההגדרות נשמרו'); render();
      });
      break;
    }
    case 'signout': if (signOut) signOut(); break;
  }
});

async function issueInvoice() {
  const amount = round2(I.amount), vat = round2(I.vat);
  if (!I.date || !(amount > 0)) { I.error = 'הזן תאריך וסכום.'; render(); return; }
  if (I.period > I.periodTo) { I.error = 'חודש ההתחלה מאוחר מחודש הסיום.'; render(); return; }
  I.busy = true; I.error = ''; render();
  const f = I;
  try {
    /* The number is taken inside mutate, so it stays sequential even if another device issued one a moment earlier. */
    const inv = await store.mutate(s => {
      const rec = { id: uid(), no: s.nextInvoiceNo, paymentId: f.paymentId, date: f.date, period: f.period, periodTo: f.periodTo, service: f.service, amount, vat, total: round2(amount + vat), vatRate: round2(vat / amount * 100), allocationNo: f.allocationNo, docTitle: s.docTitle, issuer: { ...s.issuer }, customer: { ...s.customer } };
      s.nextInvoiceNo++;
      s.invoices.push(rec);
      return rec;
    });
    const blob = await invoicePdf(inv, 'מקור');
    try { await store.backend.putFile('חשבוניות/' + inv.no + '.pdf', blob); toast('חשבונית ' + inv.no + ' הופקה ונשמרה'); }
    catch (err) { toast('החשבונית הופקה אך לא נשמרה בענן. שמור את הקובץ שיורד.', true); }
    await deliverFile(blob, 'חשבונית_' + inv.no + '.pdf');
    I = null; view = 'payments'; render();
  } catch (err) {
    console.error(err);
    I.busy = false; I.error = err.message || 'ההפקה נכשלה'; render();
  }
}

async function startGraph() {
  await loadScript(LIBS.msal);
  const scopes = ['Files.ReadWrite'];
  const app = new msal.PublicClientApplication({ auth: { clientId: CONFIG.clientId, authority: 'https://login.microsoftonline.com/common', redirectUri: location.origin + location.pathname }, cache: { cacheLocation: 'localStorage' } });
  await app.initialize();
  const res = await app.handleRedirectPromise();
  const acct = (res && res.account) || app.getAllAccounts()[0];
  if (!acct) {
    $('app').innerHTML = '<div class="stack"><h1>יומן מרפאה</h1><p class="note">הנתונים נשמרים ב-OneDrive שלך. התחבר עם חשבון Microsoft כדי להמשיך.</p><button class="primary" id="signin">התחברות עם Microsoft</button></div>';
    $('signin').onclick = () => app.loginRedirect({ scopes });
    return null;
  }
  account = acct.username;
  signOut = () => app.logoutRedirect({ account: acct });
  const getToken = async () => {
    try { return (await app.acquireTokenSilent({ scopes, account: acct })).accessToken; }
    catch (e) {
      if (e instanceof msal.InteractionRequiredAuthError) { await app.acquireTokenRedirect({ scopes, account: acct }); }
      throw e;
    }
  };
  return GraphBackend(getToken, (u, o) => fetch(u, o), CONFIG.folder);
}
